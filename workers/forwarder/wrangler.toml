name = "links-forwarder"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Cloudflare Analytics Engine dataset for fast, native click & traffic metrics
[[analytics_engine_datasets]]
binding = "LINK_METRICS"
dataset = "link_clicks"

# KV namespace for caching active shortlinks at the edge (sub-millisecond redirects)
# Run `npx wrangler kv:namespace create LINKS_KV` to bind in production
[[kv_namespaces]]
binding = "LINKS_KV"
id = "LINKS_KV_ID_PLACEHOLDER"

[vars]
# Optional fallback if link is not found
FALLBACK_URL = "https://links.intenthost.com"
